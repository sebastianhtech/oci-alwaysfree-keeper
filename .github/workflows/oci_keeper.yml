name: OCI Always Free Keeper 24/7

on:
  schedule:
    # Respaldo cron automático cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: oci-keeper-single-runner
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OCI Keeper
        id: keeper
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_AD: ${{ secrets.OCI_AD }}
          OCI_BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          MAX_RUN_SECONDS: 18000 # 5 horas de cacería continua
        run: python keeper.py

      - name: Re-trigger next cycle if needed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN || github.token }}
        run: |
          echo "Re-despachando el siguiente ciclo para mantener el bot 24/7..."
          gh workflow run oci_keeper.yml --repo ${{ github.repository }} || true
